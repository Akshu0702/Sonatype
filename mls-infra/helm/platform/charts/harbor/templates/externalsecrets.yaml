{{- $es := .Values.externalSecrets }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-admin
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $es.storeName }} }
  target: { name: harbor-admin, creationPolicy: Owner }
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef: { key: {{ required "externalSecrets.adminPassword is required" $es.adminPassword }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-db
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $es.storeName }} }
  target: { name: harbor-db, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: {{ required "externalSecrets.databasePassword is required" $es.databasePassword }} }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-core-secret-key
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $es.storeName }} }
  target: { name: harbor-core-secret-key, creationPolicy: Owner }
  data:
    - secretKey: secretKey
      remoteRef: { key: {{ required "externalSecrets.coreSecretKey is required" $es.coreSecretKey }} }
