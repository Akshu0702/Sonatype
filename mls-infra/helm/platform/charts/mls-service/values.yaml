# Defaults for every platform service. A service's own values file (helm/platform/values/<env>/<service>.yaml) sets what differs.
nameOverride: ""

image:
  repository: "" # required, for example harbor.uat.mls.internal/mls/tenants-service
  tag: "" # required. Written by the promote step (a pull request), never by hand. The feed version of the artifact.
  digest: "" # optional; when set the image is pinned by digest and the tag is only a label
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-pull # created by the pull ExternalSecret below from the Harbor pull robot

replicaCount: 2
port: 8080
healthPath: /actuator/health

# Plain settings (never secrets).
env: {}

# Settings taken from Secrets Manager through External Secrets. Each entry becomes an environment variable.
# remoteRef is the secret name, for example mls/uat/tenants/db-password.
externalSecret:
  enabled: true
  storeName: aws-secrets-manager
  refreshInterval: 1h
  data: []

# The pull credential for Harbor, built from the pull robot account (the secret holds {"username": "...", "password": "..."}).
pullSecret:
  enabled: true
  name: harbor-pull
  remoteRef: "" # mls/<env>/harbor/pull-robot
  registry: "" # harbor.<env>.mls.internal

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: alb
  host: ""
  path: /
  annotations: {}

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 1Gi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

# A volume that outlives the pod (single replica only: a ReadWriteOnce volume attaches to one node).
persistence:
  enabled: false
  size: 20Gi
  storageClass: gp3
  mountPath: /data

# Files rendered into a ConfigMap and mounted read-only, for example the console's config.json.
configFiles:
  enabled: false
  mountPath: /config
  files: {}

# Writable scratch space for a read-only root file system.
tmpDirs:
  - /tmp

extraVolumes: []
extraVolumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
