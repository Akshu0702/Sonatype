apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mls-service.name" . }}
  labels:
    {{- include "mls-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ ternary "Recreate" "RollingUpdate" .Values.persistence.enabled }}
  selector:
    matchLabels:
      {{- include "mls-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mls-service.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mls-service.name" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mls-service.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: {{ include "mls-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range .Values.externalSecret.data }}
            - name: {{ .secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mls-service.name" $ }}-secrets
                  key: {{ .secretKey }}
            {{- end }}
          startupProbe:
            httpGet: { path: {{ .Values.healthPath }}, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: {{ .Values.healthPath }}, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: {{ .Values.healthPath }}, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- range $i, $d := .Values.tmpDirs }}
            - { name: tmp-{{ $i }}, mountPath: {{ $d }} }
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - { name: data, mountPath: {{ .Values.persistence.mountPath }} }
            {{- end }}
            {{- if .Values.configFiles.enabled }}
            - { name: files, mountPath: {{ .Values.configFiles.mountPath }}, readOnly: true }
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- range $i, $d := .Values.tmpDirs }}
        - { name: tmp-{{ $i }}, emptyDir: {} }
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mls-service.name" . }}-data
        {{- end }}
        {{- if .Values.configFiles.enabled }}
        - name: files
          configMap:
            name: {{ include "mls-service.name" . }}-files
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
