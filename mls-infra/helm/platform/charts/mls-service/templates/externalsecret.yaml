{{- if and .Values.externalSecret.enabled .Values.externalSecret.data }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mls-service.name" . }}-secrets
  labels:
    {{- include "mls-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "mls-service.name" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef }}
    {{- end }}
{{- end }}
{{- if and .Values.pullSecret.enabled .Values.pullSecret.remoteRef }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.pullSecret.name }}
  labels:
    {{- include "mls-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ .Values.pullSecret.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .Values.pullSecret.registry }}":{"username":"{{ "{{ .username }}" }}","password":"{{ "{{ .password }}" }}"}}}'
  dataFrom:
    - extract:
        key: {{ .Values.pullSecret.remoteRef }}
{{- end }}
