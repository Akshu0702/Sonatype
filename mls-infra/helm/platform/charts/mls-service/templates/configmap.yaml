{{- if .Values.configFiles.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mls-service.name" . }}-files
  labels:
    {{- include "mls-service.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.configFiles.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
