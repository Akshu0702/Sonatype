# portal-api in prod. Rendered by helm/platform/charts/mls-service. Nothing for prod exists in AWS yet: these are values for a cluster that has not been built.
# image.tag is written by the promote step (a pull request): "unpromoted" means no image has been promoted to this environment.
# Names ending in .mls.internal are placeholders until the private DNS zone is decided.
image:
  repository: harbor.prod.mls.internal/mls/portal-api
  tag: unpromoted
pullSecret:
  remoteRef: mls/prod/harbor/pull-robot
  registry: harbor.prod.mls.internal
port: 8080
healthPath: /api/v1/actuator/health
env:
  TENANTS_URL: http://tenants-service
  AWS_REGION: ap-south-1
# The environments view reads EC2 with a read-only role (task 7985). Add its eks.amazonaws.com/role-arn annotation here once it exists.
serviceAccount:
  annotations: {}
autoscaling:
  minReplicas: 3
  maxReplicas: 6
