cluster-autoscaler:
  awsRegion: ap-south-1
  replicaCount: 1
  rbac:
    serviceAccount:
      create: true
      name: cluster-autoscaler
  nodeSelector:
    workload: system
  extraArgs:
    balance-similar-node-groups: true
    skip-nodes-with-system-pods: false
    expander: least-waste
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
    limits:
      memory: 600Mi
