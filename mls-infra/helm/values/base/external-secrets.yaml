external-secrets:
  installCRDs: true
  replicaCount: 2
  serviceAccount:
    create: true
    name: external-secrets
  nodeSelector:
    workload: system
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  webhook:
    nodeSelector:
      workload: system
  certController:
    nodeSelector:
      workload: system
