---
- name: Restart auditd
  # auditd refuses a restart through systemctl on Red Hat family hosts, so the service command is used.
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true
  when: auditd_manage_services | bool

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: auditd_manage_services | bool
