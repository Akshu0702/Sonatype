---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ baseline_hardening_sshd_service }}"
    state: restarted
  when: baseline_hardening_manage_services | bool

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: baseline_hardening_apply_sysctl | bool

- name: Restart chrony
  ansible.builtin.service:
    name: "{{ baseline_hardening_chrony_service }}"
    state: restarted
  when: baseline_hardening_manage_services | bool

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
  when: baseline_hardening_manage_services | bool
