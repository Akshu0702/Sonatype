# Cluster add-ons of uat, from the same wrapper charts the lab clusters use, with the uat values. No automated sync.
# For the uat cluster's OWN Argo CD only; not applied anywhere.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - app: aws-load-balancer-controller
            namespace: kube-system
          - app: cluster-autoscaler
            namespace: kube-system
          - app: metrics-server
            namespace: kube-system
          - app: fluent-bit
            namespace: logging
          - app: external-secrets
            namespace: external-secrets
  template:
    metadata:
      name: "{{ .app }}"
      labels:
        env: uat
    spec:
      project: platform-uat
      source:
        repoURL: https://dev.azure.com/ML-AIML-COE/Sonatype-MLS/_git/mls-infra
        targetRevision: develop
        path: "helm/charts/{{ .app }}"
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "../../values/base/{{ .app }}.yaml"
            - "../../values/uat/{{ .app }}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
