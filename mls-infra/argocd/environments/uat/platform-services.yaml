# The platform services of uat. One application per service, from the generic chart and the service's own values.
# UAT syncs automatically (never prunes).
# For the uat cluster's OWN Argo CD only; not applied anywhere.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { app: tenants-service }
          - { app: itsm-api }
          - { app: portal-api }
          - { app: console-ui }
  template:
    metadata:
      name: "{{ .app }}"
      labels:
        env: uat
    spec:
      project: platform-uat
      source:
        repoURL: https://dev.azure.com/ML-AIML-COE/Sonatype-MLS/_git/mls-infra
        targetRevision: develop
        path: helm/platform/charts/mls-service
        helm:
          valueFiles:
            - "../../values/uat/{{ .app }}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: platform
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
