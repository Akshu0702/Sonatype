# The store the External Secrets of uat read from: AWS Secrets Manager, with the add-on's IAM role (no keys).
# For the uat cluster's OWN Argo CD only; not applied anywhere.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
